name: Docker build and publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU 用于跨架构构建：runner 是 amd64，但要同时产出 linux/arm64 镜像。
      # 它向内核注册 binfmt_misc 处理器，让 arm64 二进制在 amd64 上被模拟执行，
      # 否则 arm64 构建遇到 Dockerfile 里的 RUN 会报 "exec format error"。
      # 注意：这是软件模拟，arm64 那条链路会明显偏慢。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jiangood/sing-box
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
